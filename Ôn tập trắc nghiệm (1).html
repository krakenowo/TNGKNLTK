<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn tập trắc nghiệm</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#14213d;--mute:#5b6679;--line:#d5dce7;--acc:#2f6bff;--acc-ink:#fff;--ok:#16895c;--okbg:#e2f5ec;--bad:#c93a46;--badbg:#fde8ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#18223a;--ink:#e8edf7;--mute:#98a3b8;--line:#2b3856;--acc:#6b95ff;--acc-ink:#0f1624;--ok:#4cc790;--okbg:#12342a;--bad:#ff7b86;--badbg:#3a1a20}}
:root[data-theme="dark"]{--bg:#0f1624;--card:#18223a;--ink:#e8edf7;--mute:#98a3b8;--line:#2b3856;--acc:#6b95ff;--acc-ink:#0f1624;--ok:#4cc790;--okbg:#12342a;--bad:#ff7b86;--badbg:#3a1a20}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;margin:8px 0 4px}
p.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
textarea{width:100%;min-height:260px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);color:var(--ink);font:14px/1.5 ui-monospace,Consolas,monospace}
label.chk{display:flex;gap:8px;align-items:center;margin:12px 0;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 18px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,.opt:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.err{color:var(--bad);margin-top:10px;white-space:pre-line}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 18px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem}
.q{font-size:1.2rem;font-weight:700;margin:6px 0 16px;white-space:pre-line}
.opt{display:flex;gap:12px;width:100%;text-align:left;font-weight:500;margin-bottom:10px;padding:12px 14px;border-radius:10px}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.85rem}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ok b{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt.bad b{background:var(--bad);border-color:var(--bad);color:var(--card)}
.opt:disabled{opacity:1;cursor:default}
.exp{margin-top:14px;padding:12px 14px;border-left:4px solid var(--acc);background:var(--bg);border-radius:6px}
.score{font-size:3rem;font-weight:800;letter-spacing:-.03em;margin:0}
.wrong{border-top:1px solid var(--line);padding:14px 0}
.wrong:first-of-type{border-top:0}
.wrong small{color:var(--mute);display:block}
.hide{display:none}
input[type=number]{width:84px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink);font:inherit}
#qimg{display:block;max-width:100%;border-radius:8px;margin:0 0 16px;background:#fff}
.range{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.top{display:flex;justify-content:space-between;align-items:center}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<div class="top"><h1>Ôn tập trắc nghiệm</h1><button id="theme" aria-label="Đổi giao diện sáng/tối">Sáng/Tối</button></div>

<section id="setup">
<p class="sub">Chọn một mục để bắt đầu ôn tập. Đáp án đúng lấy theo chữ in đậm trong file.</p>
<div class="card" style="margin-bottom:16px">
<strong>ÔN THI GIỮA KỲ</strong>
<p class="sub" style="margin:4px 0 0"><span id="mcount"></span> câu: câu 1 đến 77 và câu 258 đến 272 trong file.</p>
<div class="row"><button class="p" id="mstart">Làm bộ đề giữa kỳ</button></div>
</div>
<div class="card" style="margin-bottom:16px">
<strong>Bộ đề Nguyên lý thống kê (đầy đủ)</strong>
<p class="sub" style="margin:4px 0 0"><span id="pcount"></span> câu từ file PDF. Bạn có thể chọn khoảng câu muốn làm.</p>
<div class="range"><span>Từ câu</span><input type="number" id="pfrom" min="1" aria-label="Từ câu"><span>đến câu</span><input type="number" id="pto" min="1" aria-label="Đến câu"><button class="p" id="pstart">Làm bộ đề này</button></div>
<div class="err" id="perr" role="alert"></div>
</div>
<div class="card">
<strong>Tùy chọn</strong>
<label class="chk"><input type="checkbox" id="shufQ" checked> Xáo trộn thứ tự câu hỏi</label>
<label class="chk" style="margin-bottom:0"><input type="checkbox" id="shufA"> Xáo trộn thứ tự đáp án</label>
</div>
</section>

<section id="quiz" class="hide">
<div class="meta"><span id="pos"></span><span id="sc"></span></div>
<div class="bar"><i id="fill"></i></div>
<div class="card">
<div class="q" id="qt"></div>
<img id="qimg" class="hide" alt="Hình minh họa cho câu hỏi">
<div id="opts"></div>
<div class="exp hide" id="exp"></div>
<div class="row"><button class="p" id="next" disabled>Câu tiếp theo</button><button id="quit">Thoát</button></div>
</div>
</section>

<section id="result" class="hide">
<div class="card">
<p class="score" id="final"></p>
<p class="sub" id="msg"></p>
<div id="wrongs"></div>
<div class="row"><button class="p" id="again">Làm lại</button><button id="retryWrong">Chỉ làm lại câu sai</button><button id="back">Về trang chủ</button></div>
</div>
</section>
</main>

var PRESET = [{"n":1,"q":"Thu nhập một năm của 12 giảng viên trường ĐH A được tổng hợp ở bảng sau (ĐVT: 1000đ). Theo anh/chị quan sát nào được xem là một giá trị ngoại lệ (khác biệt) cần loại trừ ra mẫu? 50,000 51,000 51,000 52,500 54,300 57,500\n58,000 56,600 59,200 61,560 56,400 147,000","o":["147,000","50,000","51,000","61,560"],"a":0},{"n":2,"q":"Trong 1 kỳ thi, bài thi môn NLKT có điểm trung bình là 7.4 và độ lệch chuẩn là 0.8 còn bài thi NLTK có điểm trung bình là 7.8 và độ lệch chuẩn là 10. SV A đạt được 9 điểm ở cả hai môn thi, dựa vào hệ số chuẩn hoá Z-score ta có thể kết luận gì?","o":["Kết quả thi môn NLKT tốt hơn môn NLTK.","Kết quả thi môn NLTK tốt hơn môn NLKT.","Kết quả thi môn NLKT và môn NLTK là như nhau.","Không kể kết luận gì."],"a":0},{"n":3,"q":"Sinh viên A viết câu lệnh trên R như sau\n>c(1,2,3) + c(4,5,6)\nTheo anh/chị thì kết quả nào sau đây là đúng:","o":["[1] 5 7 9","[1] 21","[1] 6 1 5","[1] 1 2 3 4 5 6"],"a":0},{"n":4,"q":"Sinh viên A có 1 bảng dữ liệu trên R có tên Data gồm các biến (SinhVien, GioiTinh, Tuoi, ChieuCao). Bạn sử dụng R viết câu lệnh sau:\n>Data$ChieuCao\n[1] 165 164 163 163 170 160\nSinh viên A thực hiện tiếp lệnh\n>summary(Data$ChieuCao)\nMin. 1stQU. Median Mean 3rd Qu. Max.\n160.6 163.0 x y 164.8 170.0\nTừ kết quả này thì phát biểu nào sau đây là đúng?","o":["75% quan sát có chiều cao từ 164.8 trở xuống.","75% quan sát có chiều cao từ 164.8 trở lên.","25% quan sát có chiều cao từ 164.8 trở xuống.","25% quan sát có chiều cao từ 164.8 trở lên."],"a":0},{"n":5,"q":"Sinh viên A có 1 bảng dữ liệu trên R có tên Data gồm các biến (SinhVien, GioiTinh, Tuoi, ChieuCao. Bạn sử dụng R viết câu lệnh sau:\n>Data$ChieuCao\n[1] 165 164 163 163 170 160\nSinh viên A thực hiện tiếp lệnh\n>mean(Data$ChieuCao)\nKết quả sinh viên A nhận được là?","o":["164.17","163.5","161.47","165.3"],"a":0},{"n":6,"q":"Sinh viên A có 1 bảng dữ liệu trên R có tên Data gồm các biến (SinhVien, GioiTinh, Tuoi, ChieuCao. Bạn sử dụng R viết câu lệnh sau:\n>Data$ChieuCao\n[1] 165 164 163 163 170 160\nSinh viên A thực hiện tiếp lệnh\n>summary(Data$ChieuCao)\nMin. 1stQU. Median Mean 3rd Qu. Max.\n160.6 163.0 x y 164.8 170.0\nKết quả này cho biết khoảng tứ phân vị (IQR) là:","o":["1.8","163","164.8","163 – 164.8."],"a":0},{"n":7,"q":"Sinh viên A có 1 bảng dữ liệu trên R có tên Data gồm các biến (SinhVien, GioiTinh, Tuoi, ChieuCao. Bạn sử dụng R viết câu lệnh sau:\n>Data$ChieuCao\n[1] 165 164 163 163 170 160\nSinh viên A thực hiện tiếp lệnh\n>Data$ChieuCao[Data$ChieuCao>163|Data$ChieuCao <163] Kết quả sinh viên A nhận được là?","o":["[1] 165 164 170 160.","[1] 160 164 165 170.","Không có giá trị thoả điều kiện.","[1] 163."],"a":0},{"n":8,"q":"Sinh viên A có 1 bảng dữ liệu trên R có tên Data gồm các biến (SinhVien, GioiTinh, Tuoi, ChieuCao. Bạn sử dụng R viết câu lệnh sau:\n>Data$ChieuCao\n[1] 165 164 163 163 170 160\nSinh viên A thực hiện tiếp lệnh\n>Data$ChieuCao[Data$ChieuCao>163]\nKết quả sinh viên A nhận được là?","o":["[1] 165 164 170.","[1] 163 163 164 165 170.","[1] 165 164 163 163 170.","[1] 164 165 170."],"a":0},{"n":9,"q":"Chỉ tiêu nào sau đây KHÔNG là chỉ tiêu đo lường độ phân tán (dao động) của dữ liệu:","o":["Trung bình cộng.","Phương sai.","Độ lệch chuẩn.","Hệ số biến thiên"],"a":0},{"n":10,"q":"Trong các biến sau thì biến nào là biến định danh thứ bậc: giới tính, màu sắc yêu thích, thang đo Likert, độ khó của bài kiểm tra (dễ, trung bình, khó, rất khó)?","o":["Thang đo Likert và độ khó bài kiểm tra.","Giới tính và màu sắt yêu thích.","Màu sắc yêu thích và độ khó bài kiểm tra.","Màu sắc yêu thích và thanh đo Likert"],"a":0},{"n":11,"q":"Để đánh giá năng lực sinh viên ngành kế toán sau khi tốt nghiệp, một nhóm nghiên cứu tiến hành khảo sát lương tháng đầu một mẫu ngẫu nhiên 27SV. Biểu đồ tần suất về tiền lương như sau, cho biết biểu đồ này có dạng?","o":["Lệch phải","Lệch trái","Cân xứng","Có duôi dài"],"a":0,"img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQ  học tiếng Anh chuẩn bị cho kỳ thi B1. Để đạt B1 thì SV cần có điểm trung bình cho 4 kỹ năng từ 4.0 – 5.5 điểm. Có 3 TTNN (I, II, III) gửi thông tin đến A như sau:\n▪ TTNN I: điểm trung bình các HV đạt là 5, độ lệch chuẩn là 1.1.\n▪ TTNN II: điểm trung bình các HV đạt là 5.2, độ lệch chuẩn là 1.5.\n▪ TTNN III: điểm trung bình các HV đạt là 4.6, độ lệch chuẩn là 0.5. Theo anh/chị A nên chọn TTNN nào?","o":["TTNN I (5 ± 1.1)","TTNN II (5.2 ± 1.5)","TTNN III (4.6 ± 0.5)","Tất cả cả TTNN đều đảm bảo"],"a":2},{"n":14,"q":"Trong 3 trường hợp sau, trường hợp nào có số liệu thống kê thuộc về chỉ tiêu thống kê mẫu:\n▪ TH1: Một cuộc khảo sát khoảng 9400 cá nhân Mỹ từ 15 tuổi trở lên cho thấy những cá nhân này dành trung bình 5.19 giờ/ngày cho các hoạt động giải trí (Nguồi: Cục TKLĐ Mỹ).\n▪ TH2: SV năm nhất K19 trường ĐHCN TP.HCM có điểm trung bình tốt nghiệp phổ thông môn toán là 8.2.\n▪ TH3: Trong đợt kiểm tra ngẫu nhiên vài trăm cửa hàng bán lẻ, FDA Mỹ phát hiện 34% cửa hàng không bảo quản cá ở nhiệt độ thích hợp.","o":["TH1 và TH3","TH2","TH1","TH3"],"a":0},{"n":15,"q":"Thu nhập một năm của 12 giảng viên trường ĐH A được tổng hợp ở bảng sau (ĐVT: 1000đ). Giả sử anh/chị là BGH muốn tìm một chỉ tiêu thống kê thể hiện độ tập trung của dữ liệu để làm cơ sở từ chối tăng lương thì chỉ tiêu nào dưới đây là phù hợp nhất? 50,000 51,000 51,000 52,500 54,300 57,500\n58,000 56,600 59,200 61,560 56,400 147,000","o":["Số trung bình số học","Số yếu vị (số Mode)","Số trung vị","Số trung bình hình học (Trung bình nhân)"],"a":2},{"n":16,"q":"Quang và Khang cùng học môn NLTK nhưng khác lớp học phần, nên bài thi cuối kỳ cũng khác nhau. Mỗi lớp học phần giới hạn 100SV đăng ký. Quang được 8.3/10 điểm và thuộc về bách phân vị thứ 72 trong lớp, còn Khang đạt được 8.5/10 điểm và thuộc bách phân vị thứ 70 trong lớp. Trên phương diện so sánh với các bạn cùng lớp học phần thì bạn nào có kết quả thi tốt hơn?","o":["Quang","Khang","Như nhau","Không kết luận được"],"a":0},{"n":17,"q":"Trong một cuộc điề "q":"Khi xem điểm trung bình môn NLTK, sinh viên A thấy mình đạt được 9 điểm trong thang điểm từ 1 đến 10 điểm. Như vậy, có thế thể kết luận sinh viên A thuộc tứ phân vị nào về điểm NLTK trong lớp?","o":["Không thể kết luận","25% cao nhất","Q3","Q2"],"a":0},{"n":21,"q":"Trong một nghiên cứu, người ta có được một tổng thể gồm nam và nữ. Hai tổng thể này đều có phân phối chuẩn. Trong tổng thể nam, chiều cao trung bình là 178cm và độ lệch chuẩn là 7.6cm. Trong tổng thể nữ, chiều cao trung bình là 163cm và độ lệch chuẩn là 6.6cm. Sử dụng hệ số chuẩn hoá (Z-score) để xem phát biểu nào dưới đây là đúng?","o":["Nam cao 183cm là bình thường còn nữ cao 183cm là không thường gặp.","Nam cao 183cm và nữ cao 183cm là bình thường.","Nam cao 183cm và nữ cao 183cm là không thường gặp.","Nữ cao 183cm là bình thường còn nam cao 183cm là không thường gặp."],"a":0},{"n":22,"q":"Sinh viên A viết câu lệnh tên R như bên dưới. Theo anh/chị kết quả nào sau đây đúng?\n>F+T+T+T","o":["[1] 3","[1] 4","[1] FTTT","[1] Thông báo lỗi"],"a":0},{"n":23,"q":"Sinh viên A viết câu lệnh tên R như bên dưới. Theo anh/chị kết quả nào sau đây đúng?\n>1+1 #Kết quả","o":["[1] 2","[1] 1+1 #Kết quả","[1] 2 #Kết quả","[1] #Kết quả 2"],"a":0},{"n":24,"q":"Một nhà đầu tư đang xem xét 3 phương án đầu tư sau:\n✓ PA1: tỷ lệ sinh lời bình quân 7%/năm và độ lệch chuẩn 7%.\n✓ PA2: tỷ lệ sinh lời bình quân 10%/năm và độ lệch chuẩn 4%.\n✓ PA3: tỷ lệ sinh lời bình quân 9%/năm và độ lệch chuẩn 6%. Với mục đích lựa chọn PA có khả năng sinh lời cao nhất, theo anh/chị nhà đầu tư nên chọn PA nào?","o":["PA3","PA1","PA2","PA2 và PA3"],"a":2},{"n":25,"q":"Trên R có biến data, khi xem xét cấu trúc của biến data bằng lệnh:\n>data\n[1] 3 2 1 5 4 7\nSinh viên A thực hiện tiếp lệnh\n>data[3]\nKết quả nhận được là?","o":["[1] 1","[1] 3","[1] 6","[1] 3 2 1"],"a":0},{"n":26,"q":"Một bộ dữ liệu có giá trị trong khoảng từ giá trị nhỏ nhất là 10 đến giá trị lớn nhất là 50. Bạn Quang xác định sẽ phần thành 4 tổ với khoảng cách tổ là 10. Hỏi các tổ nào dưới đây là đúng?","o":["Các cách phân loại còn lại đều sai","10-19, 20-29, 30-39, 40-49","10-20, 20-30, 30-40, 40-50","10-20, 21-31, 32-42, 43-53"],"a":2},{"n":27,"q":"Để xem xét tình hình học tập tại nhà, một nhóm SV đã thu thập bộ dữ liệu bằng cách phỏng vấn các SV khoá 19 ngành KTKT. Theo anh/chị bộ dữ liệu thu thập được trích ra dưới đây có bao nhiêu biến?","o":["4 (vì SV chỉ là ID)","5","6","7"],"a":0,"img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAFvAi8DASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD6W1rxRoPhswjW9b0zSzcbvJ+23SQ+Ztxu27iM43LnHTI9azP+Fn+A/wDodvDP/g0g/wDiqZrul2eq+ONFivIfNRdMv2A3FcHzbT0IrQ/4Q7Q/+fH/AMiv/jQBS/4Wf4D/AOh28M/+DSD/AOKo/wCFn+A/+h28M/8Ag0g/+Kq7/wAIdof/AD4/+RX/AMaP+EO0P/nx/wDIr/40AUv+Fn+A/wDodvDP/g0g/wDiqP8AhZ/gP/odvDP/AINIP/iqu/8ACHaH/wA+P/kV/wDGj/hDtD/58f8AyK/+NAFL/hZ/gP8A6Hbwz/4NIP8A4qj/AIWf4D/6Hbwz/wCDSD/4qrv/AAh2h/8APj/5Ff8Axo/4Q7Q/+fH/AMiv/jQBS/4Wh4Dzj/hNvDGR2/tSD/4qj/hZ/gP/AKHbwz/4NIP/AIqud0Twto7/ABQ8VwNZ5jj07S2UeY/BLXWe/sK6/wD4Q7Q/+fH/AMiv/jQBS/4Wf4D/AOh28M/+DSD/AOKo/wCFn+A/+h28M/8Ag0g/+Kq7/wAIdof/AD4/+RX/AMaP+EO0P/nx/wDIr/40AUv+Fn+A/wDodvDP/g0g/wDiqP8AhZ/gP/odvDP/AINIP/iqu/8ACHaH/wA+P/kV/wDGj/hDtD/58f8AyK/+NAFL/hZ/gP8A6Hbwz/4NIP8A4qj/AIWf4D/6Hbwz/wCDSD/4qrv/AAh2h/8APj/5Ff8A 2,"q":"Nếu bạn muốn chọn một mẫu từ tổng thể nhưng không có danh sách đầy đủ các cá thể, phương pháp chọn mẫu nào phù hợp nhất?","o":["Chọn mẫu ngẫu nhiên đơn giản","Chọn mẫu phân tầng","Chọn mẫu hệ thống","Chọn mẫu chùm (Cluster Sampling)"],"a":3},{"n":133,"q":"Điều nào sau đây là đặc trưng của khoảng tin cậy?","o":["Nếu tính khoảng tin cậy 95%, thì xác suất giá trị thực nằm trong khoảng này là 95%.","Nếu lấy mẫu nhiều lần, khoảng 95% khoảng tin cậy sẽ chứa tham số thực.","Khoảng tin cậy rộng hơn khi kích thước mẫu tăng.","Khoảng tin cậy không bị ảnh hưởng bởi sai số lấy mẫu."],"a":1},{"n":134,"q":"Trong phương pháp chọn mẫu ngẫu nhiên đơn giản, giả sử bạn đã chọn được 50 phần tử từ tổng thể 1000 phần tử. Khi đó, xác suất một phần tử cụ thể được chọn là:","o":["50%","5%","0.5%","0.05%"],"a":1},{"n":135,"q":"Khi sử dụng ước lượng khoảng cho trung bình tổng thể, nếu tổng thể có phân phối chuẩn nhưng phương sai chưa biết, thì thống kê nào được sử dụng?","o":["Phân phối chuẩn N(0,1)","Phân phối Student's t","Phân phối χ2","Phân phối Poisson"],"a":1},{"n":136,"q":"Khi sử dụng phương pháp ước lượng khoảng cho tỷ lệ, nếu không biết tỷ lệ (p), công thức tính kích thước mẫu n tối thiểu để có độ chính xác mong muốn là gì?","o":["n = Z²·p(1−p)/ε²","n = Z²/(4ε²)","n = Z/ε","n = Z²·p/ε"],"a":0},{"n":137,"q":"Khi chọn mẫu ngẫu nhiên đơn giản từ một tổng thể, nếu số lượng mẫu là n, phương sai của ước lượng trung bình mẫu là gì?","o":["Var(X̄) = σ²/n","Var(X̄) = σ²/(n−1)","Var(X̄) = σ²/√n","Var(X̄) = σ/n"],"a":0},{"n":138,"q":"Khi nào sử dụng phương pháp chọn mẫu đơn giản thay vì phân tầng trong các nghiên cứu xã hội?","o":["Khi quần thể có sự phân bố đồng đều trong các tầng.","Khi các tầng trong tổng thể có sự khác biệt rõ ràng.","Khi kích thước mẫu rất lớn.","Khi không có thông tin phân tầng."],"a":3},{"n":139,"q":"Khi kích thước mẫu tăng lên, ảnh hưởng của sai số lấy mẫu vào ước lượng sẽ như thế nào?","o":["Giảm theo hàm số bậc hai","Tăng lên theo hàm số bậc hai","Giảm theo căn bậc hai của n","Không thay đổi"],"a":2},{"n":140,"q":"Phương pháp chọn mẫu nào có thể giảm thiểu lỗi mẫu khi tổng thể có sự phân bố không đều?","o":["Chọn mẫu ngẫu nhiên đơn giản","Chọn mẫu phân tầng","Chọn mẫu hệ thống","Chọn mẫu chùm"],"a":1},{"n":141,"q":"Giả sử có một mẫu kích thước n lấy từ một tổng thể phân phối chuẩn, nếu phương sai mẫu là S² thì ước lượng phương sai tổng thể là gì?","o":["S² = (1/(n−1))·Σ(xᵢ − x̄)² → ước lượng không chệch của PSTT","S²/n","S²/(n−1)","S²/√n"],"a":0},{"n":142,"q":"Ước lượng nào là chính xác nhất trong việc ước lượng tham số tổng thể khi kích thước mẫu nhỏ và không có thông tin về phương sai tổng thể?","o":["Ước lượng phương sai mẫu","Ước lượng trung bình mẫu","Ước lượng khoảng tin cậy với phân phối chuẩn","Ước lượng bằng phương pháp Bayes"],"a":1},{"n":143,"q":"Phương pháp chọn mẫu nào sử dụng phân chia tổng thể thành các nhóm nhỏ có sự đồng nhất nội bộ, sau đó chọn một số nhóm để khảo sát?","o":["Chọn mẫu ngẫu nhiên đơn giản","Chọn mẫu phân tầng","Chọn mẫu chùm","Chọn mẫu hệ thống"],"a":2},{"n":144,"q":"Trong ước lượng tham số, nếu mức độ tin cậy là 99%, khoảng tin cậy sẽ rộng hơn hay hẹp hơn khi so với mức độ tin cậy là 95%?","o":["Hẹp hơn","Rộng hơn","Không thay đổi","Không thể xác định được"],"a":1},{"n":145,"q":"Khi xây dựng khoảng tin cậy cho phương sai của một quần thể có phân phối chuẩn, thống kê nào được sử dụng?","o":["Phân phối chuẩn N(0,1)","Phân phối χ2","Phân phối Student's t","Phân phối Poisson"],"a":1},{"n":146,"q":"Trong một nhóm sinh viên, 25% học vật lý, 23% học xã hội, 17% học hóa, 14% học khoa học chính trị, 12% học nhân văn và 9% học toán. Xác suất của sự kiện A là xác suất chọn một sinh viên học lĩnh vực khoa học xã hội (bao gồm xã hội, khoa học chính trị và nhân vân) hoặc lĩnh vực vật lý. Xác suất để sự kiện A không xảy ra là bao nhiêu?","o":["0.51","0.26","0.49","0.74"],"a":1},{"n":147,"q":"25% tổng số sinh viên IUH cho rằng kỳ thi Nguyên lý thống kê là khó. Bạn chọn ngẫu nhiên bốn sinh viên. Xác suất NG?","o":["GDP của Việt Nam, doanh thu bán hàng của chuỗi siêu thị Vinmart, dân số của Thành phố Hà Nội được coi là tiêu thức thuộc tính","Tổng thể sinh viên thích học môn Nguyên lý thống kê kinh tế là một tổng thể bộc lộ.","Chỉ tiêu thống kê là tiêu chí mà biểu hiện bằng số của nó phản ánh quy mô, tốc độ phát triển, cơ cấu, quan hệ tỷ lệ của hiện tượng kinh tế - xã hội trong điều kiện không gian và thời gian cụ thể.","Trong bốn loại thang đo thống kê, thang đo định danh và thang đo thứ bậc là các thang đo định lượng, trong khi thang đo khoảng và thang đo tỷ lệ là các thang đo định tính."],"a":2},{"n":154,"q":"Một nhà nghiên cứu chọn 500 sinh viên từ một trường đại học có 10000 sinh viên để khảo sát mức độ hài lòng với dịch vụ thư viện. Trong trường hợp này, tập hợp 10000 sinh viên được gọi là:","o":["Mẫu (Sample)","Tổng thể (Population)","Biến ngẫu nhiên (Random Variable)","Thống kê suy diễn (Inferential Statistics)"],"a":1},{"n":155,"q":"Tổng thể đồng chất có thể trở thành tổng thể không đồng chất và ngược lại trong trường hợp:","o":["Mục đích nghiên cứu thay đổi.","Mẫu nghiên cứu thay đổi.","Đơn vị mẫu nghiên cứu thay đổi.","Đối tượng nghiên cứu thay đổi."],"a":0},{"n":156,"q":"Nghiên cứu về mức độ hài lòng của tất cả sinh viên đối với hoạt động giảng dạy của Trường ĐH Công Nghiệp TPHCM trong nghiên cứu này có thể được coi là:","o":["Tổng thể thống kê.","Đơn vị mẫu.","Mẫu.","Đơn vị tổng thể."],"a":0},{"n":157,"q":"Nên sử dụng thống kê suy diễn thay vì thống kê mô tả khi:","o":["Khi chỉ cần mô tả dữ liệu hiện có","Khi muốn đưa ra kết luận về toàn bộ tổng thể dựa trên mẫu","Khi tính toán trung bình của một tập dữ liệu","Khi dữ liệu không có sự phân tán"],"a":1},{"n":158,"q":"Tiêu thức thống kê là đặc điểm của đơn vị tổng thể được chọn ra để nghiên cứu. Việc xác định tiêu thức thống kê cần căn cứ vào:","o":["Mục đích nghiên cứu.","Mẫu nghiên cứu.","Đơn vị mẫu nghiên cứu.","Đối tượng nghiên cứu."],"a":0},{"n":159,"q":"Thông tin thu thập được trong điều tra thống kê:" 200,"q":"Thời gian chờ tàu điện tại 9 trạm tàu xác định trước và sau khi cải tiến công nghệ, tính theo phút. Kiểm tra xem liệu công nghệ mới có rút ngắn thời gian trung bình chờ tàu điện không Trạm A B C D E F G H K\nTrước 5 7 9 4 2 7 6 5 2\nSau 4 6 9 5 4 4 3 7 1","o":["Tiêu chuẩn kiểm định = 0.71, p_value = 0.249 < 0.05 ⇒ Bác bỏ H : Công nghệ giúp rút ngắn thời gian chờ. 0","Tiêu chuẩn kiểm định = - 0.71, p_value = 0.249 > 0.05 ⇒ Chấp nhận H : Công nghệ không giúp rút ngắn thời gian chờ. 0","Tiêu chuẩn kiểm định = 2.03, p_value = 0.021 < 0.05 ⇒ Bác bỏ H : Công nghệ mới có hiệu quả rõ rệt. 0","Tiêu chuẩn kiểm định = 0.71, p_value = 0.249 > 0.05 ⇒ Chấp nhận H : Không đủ bằng chứng cho thấy công nghệ 0 giúp rút ngắn thời gian chờ."],"a":3},{"n":201,"q":"Một nhà nghiên cứu muốn so sánh thời gian hoàn thành bài thi giữa hai nhóm SV học cùng một môn học nhưng với hai phương pháp giảng dạy khác nhau.\n✓Nhóm 1 (Phương pháp A): 45, 50, 52, 47, 49, 51, 46, 53.\n✓Nhóm 2 (Phương pháp B): 48, 54, 55, 50, 53, 56, 52, 54. Giả sử thời gian hoàn thành bài thi tuân theo phân phối chuẩn và có phương sai bằng nhau. Với mức ý nghĩa 5%, hãy xác định kết luận phù hợp.","o":["t = −2.61, p = 0.0207 < 0.05 ⇒ Bác bỏ H : PP giảng dạy ảnh 0 hưởng đến thời gian làm bài.","t = −2.61, p = 0.0207 > 0.05 ⇒ Không bác bỏ H : PP giảng dạy 0 không ảnh hưởng đến thời gian làm bài.","t = −1.98, p = 0.048 < 0.05 ⇒ Bác bỏ H : PP không giảng dạy 0 ảnh hưởng đáng kể đến thời gian làm bài.","t = −2.61, p = 0.0207 > 0.05 ⇒ Không bác bỏ H : PP giảng dạy 0 không ảnh hưởng đến thời gian làm bài."],"a":0},{"n":202,"q":"Một nhà nghiên cứu muốn so sánh mức độ hài lòng với dịch vụ giao hàng giữa hai khu vực khác nhau. Kết quả khảo sát như sau:\n✓Khu vực A: 120 người được hỏi, trong đó 90 người hài lòng.\n✓Khu vực B: 150 người được hỏi, trong đó 99 người hài lòng. Với mức ý nghĩa 5%, giả sử rằng hai mẫu là độc lập, hãy chọn kết luận đúng nhất:","o":["Không có sự khác biệt có ý nghĩa thống kê giữa tỷ lệ hài lòng của hai khu vực.","Có sự khác biệt có ý nghĩa thống kê giữa tỷ lệ hài lòng của hai khu vực.","Tỷ lệ hài lòng ở khu vực A thấp hơn khu vực B.","Tỷ lệ hài lòng ở khu vực B thấp hơn khu vực A."],"a":0},{"n":203,"q":"Một giảng viên đã dạy một khóa học thống kê trực tuyến và một khóa học trên lớp cảm thấy rằng phương sai của điểm thi cuối kỳ của những sinh viên đã tham gia khóa học trực tuyến lớn hơn phương sai của điểm thi cuối kỳ của những sinh viên đã tham gia khóa học trên lớp. Dữ liệu sau đây đã được thu thập. Tại α = 0.05 liệu có đủ bằng chứng để chứng minh cho tuyên bố trên không?\nHọc online: S₁ = 2.95, n₁ = 25\nHọc offline: S₂ = 2.01, n₂ = 18","o":["Có đủ bằng chứng cho thấy phương sai học online lớn hơn phương sai học offline.","Không có đủ bằng chứng cho thấy phương sai học online lớn hơn phương sai học offline.","Phương sai hai nhóm là bằng nhau.","Trung bình hai nhóm là như nhau nên không cần kiểm định phương sai."],"a":0},{"n":204,"q":"Một nghiên cứu được thực hiện để kiểm định xem phương sai chiều cao của các tòa nhà cao tầng ở Laker có khác với Riversa hay không. Chiều cao phân phối chuẩn, tính bằng feet. Mức ý nghĩa α = 0.10.\n✓ Laker: 714, 698, 721, 730, 705, 690, 708.\n✓ Riversa: 689, 670, 702, 710, 715, 680, 698, 705","o":["Có đủ bằng chứng cho thấy phương sai chiều cao ở hai thành phố là khác nhau.","Không có đủ bằng chứng cho thấy phương sai chiều cao ở hai thành phố là khác nhau.","Phương sai chiều cao ở Denver nhỏ hơn Nashville.","Trung bình chiều cao ở hai thành phố là bằng nhau."],"a":1},{"n":205,"q":"Tuổi trung bình của thú cưng là 7.5 tuổi. Hai mẫu ngẫu nhiên được chọn từ những người nuôi chó:\n✓ Mẫu 1: 20 người sống ở Milan, độ lệch chuẩn tuổi chó là 2.05 năm\n✓ Mẫu 2: 12 người sống ở London, độ lệch chuẩn tuổi chó là 0.87 năm\nGiả sử tuổi của thú cưng tuân theo phân phối chuẩn. Với mức ý nghĩa α = 0.05, kết luận về phương sai tuổi của thú cưng ở hai thành phố:","o":["Có đủ bằng chứng cho thấy phương sai tuổi chó ở Milan và London là khác nhau.","Không có đủ bằng chứng cho thấy phương sai tuổi chó ở hai thành phố là khác nhau.","Phương sai tuổi chó ở Milan nhỏ hơn London.","Trung bình tuổi chó ở hai thành phố là bằng nhau nên không cần kiểm định phương sai"],"a":0},{"n":206,"q":"Một nghiên cứu thu thập dữ liệu về chiều cao (X, đơn vị cm) và cân nặng (Y, đơn vị kg) của 5 người như sau. Hiệp phương sai giữa chiều cao và cân nặng của 5 người là bao nhiêu?\n✓ Người 1: X = 160, Y = 50.\n✓ Người 2: X = 165, Y = 53.\n✓ Người 3: X = 170, Y = 56.\n✓ Người 4: X = 175, Y = 60.\n✓ Người 5: X = 180, Y = 65","o":["27.50","31.25","35.00","46.25"],"a":3},{"n":207,"q":"Một nghiên cứu thu thập dữ liệu về chiều cao (X, đơn vị cm) và cân nặng (Y, đơn vị kg) của 5 người như sau. Tính hệ số tương quan giữa chiều cao và cân nặng 5 người. Người 1: X = 160, Y = 50. Người 2: X = 165, Y = 53. Người 3: X = 170, Y = 56. Người 4: X = 175, Y = 60. Người 5: X = 180, Y = 65","o":["r = 0.98, có mối tương quan tuyến tính rất mạnh, cùng chiều.","r = 0.65, có mối tương quan tuyến tính trung bình, cùng chiều.","r = 0.25, mối tương quan yếu.","r = −0.98, có mối tương quan mạnh, ngược chiều"],"a":0},{"n":208,"q":"Lệnh sau có ý nghĩa gì?\nx <- c(4, 6, 8, 10, 12)\nmean(x)","o":["Tính trung vị của x","Tính trung bình cộng của x","Tính tổng các giá trị của x","Tính độ lệch chuẩn của x"],"a":1},{"n":209,"q":"Hàm nào sau đây để tính phương sai mẫu trong R?","o":["var()","variance()","sd()","mean()"],"a":0},{"n":210,"q":"Hàm summary() cho kết quả gì?","o":["Trung bình","Tổng các giá trị","Các chỉ tiêu thống kê cơ bản","Độ lệch chuẩn"],"a":2},{"n":211,"q":"Cú pháp sau trả về gì?\nx <- c(1, 2, 3, 4)\nlength(x)","o":["Tổng các giá trị","Số lượng phần tử","Trung bình cộng","Không có gì"],"a":1},{"n":212,"q":"Để vẽ biểu đồ histogram, dùng hàm nào?","o":["barplot()","hist()","plot()","pie()"],"a":1},{"n":213,"q":"Biểu đồ nào thể hiện sự phân phối tần suất?","o":["Histogram","Bar chart","Boxplot","Scatter plot"],"a":0},{"n":214,"q":"Lệnh nào kiểm định phân phối ":245,"q":"Kiểm định giả thuyết về sự khác biệt giữa hai tỷ lệ, dùng:","o":["t-test","prop.test()","var.test","shapiro.test"],"a":1},{"n":246,"q":"Ý nghĩa của mức ý nghĩa (α) là:","o":["Xác suất mắc sai lầm loại 1","Xác suất mắc sai lầm loại 2","Độ mạnh của kiểm định","p-value"],"a":0},{"n":247,"q":"Công cụ nào sau đây KHÔNG dùng kiểm định giả thuyết trong R?","o":["t.test","var.test","pie()","chisq.test"],"a":2},{"n":248,"q":"Khi mẫu lớn (n > 30) và biết σ, dùng kiểm định:","o":["t-test","Z-test","var.test","proportion.test"],"a":1},{"n":249,"q":"Quy mô trung bình của một trang trại ở vùng nông thôn Pháp là 69 ha (2020). Một mẫu ngẫu nhiên gồm 50 trang trại trên toàn nước Pháp cho thấy quy mô trung bình là 68 ha với độ lệch chuẩn là 6.36 ha. Ở mức ý nghĩa α = 0.05, sử dụng phương pháp p-value thì có thể kết luận gì về quy mô trung bình của các trang trại ở Pháp so với quy mô trung bình toàn quốc? Biết giá trị tới hạn của Z lần lượt là\n✓ P(Z = -1.11) = 0.1335\n✓ P(Z = -1.12) = 0.1314\n✓ P(Z = - 1.69) = 0.0455","o":["Không bác bỏ H . Có đủ bằng chứng tại mức ý nghĩa α = 0.10 0 để kết luận rằng quy mô trung bình khác 69 ha.","Bác bỏ H . Có đủ bằng chứng tại mức ý nghĩa α = 0.01 để kết 0 luận rằng quy mô trung bình khác 69 ha.","Bác bỏ H . Có đủ bằng chứng tại mức ý nghĩa α = 0.05 để kết 0 luận rằng quy mô trung bình khác 69 ha.","Không bác bỏ H . Không có đủ bằng chứng tại mức ý nghĩa 0 α = 0.05 để kết luận rằng quy mô trung bình khác 69 ha."],"a":3},{"n":250,"q":"Thời lượng pin trung bình của một mẫu điện thoại thông minh phổ biến hiện nay được quảng cáo là 10 giờ. Một nhóm nghiên cứu đã tiến hành thử nghiệm trên 40 chiếc smartphone cùng loại và thu được thời lượng pin trung bình là 10.8 giờ với độ lệch chuẩn là 1.5 giờ và giá trị tới hạn là ±3.37 tương ứng với P(Z) = 0.9996. Với mức ý nghĩa α = 0.02, có thể kết luận rằng thời lượng pin trung bình của mẫu điện thoại này khác 10 giờ như đã quảng cáo hay không?","o":["Không bác bỏ H0. Kết luận rằng thời lượng pin trung bình là không khác 10 giờ như quảng cáo.","Không bác bỏ H0. Kết luận rằng không có đủ bằng chứng thống kê để khẳng định thời lượng pin trung bình khác 10 giờ.","Bác bỏ H0. Kết luận rằng có đủ bằng chứng để cho rằng thời lượng pin trung bình khác 10 giờ.","Bác bỏ H0. Kết luận rằng thời lượng pin trung bình lớn hơn 10 giờ."],"a":2},{"n":251,"q":"Một nhà sản xuất chứng minh rằng thời lượng pin trung bình của một mẫu điện thoại thông minh phổ biến hiện nay được quảng cáo dài hơn 10 giờ. Giả thuyết H₀ và H₁ nên được xác định như thế nào?","o":["H₀: μ ≤ 10, H₁: μ > 10","H₀: μ ≥ 10, H₁: μ < 10","H₀: μ > 10, H₁: μ ≤ 10","H₀: μ = 10, H₁: μ > 10"],"a":0},{"n":252,"q":"Câu lệnh R sau đây được sử dụng để thực hiện mục đích nào? t.test(data, conf.level = 0.95)$conf.int","o":["Tính giá trị p-value của kiểm định trung bình","Thực hiện kiểm định giả thuyết về trung bình tổng thể","Tính khoảng tin cậy 95% cho trung bình tổng thể","Thực hiện kiểm định giả thuyết về tỷ lệ tổng thể"],"a":2},{"n":253,"q":"Câu lệnh R sau đây:\nt.test(groupA$weight, groupB$weight, alternative = \"greater\", var.equal = FALSE)\nKết quả: p-value = 0.018. Với giả thuyết H0: Cân nặng trung bình của nhóm A ≤ nhóm B, và mức ý nghĩa α = 0.05. Kết luận nào sau đây là đúng?","o":["Chưa đủ bằng chứng để bác bỏ H0","Nhóm B nặng hơn nhóm A","Nhóm A nặng hơn nhóm B","Không thể kết luận gì"],"a":2},{"n":254,"q":"Một mẫu ngẫu nhiên gồm 36 nhà máy điện cho thấy trung bình mỗi nhà máy sử dụng 1.120 tấn than mỗi năm. Độ lệch chuẩn tổng thể là 60 tấn. Với mức tin cậy 95%, hãy ước lượng khoảng tin cậy cho lượng than trung bình mà một nhà máy điện sử dụng mỗi năm. Giả sử một nhà máy điện báo cáo đã sử dụng 1.200 tấn than trong năm nay. Anh/chị có thể kết luận điều gì?","o":["1.140 < μ < 1.200. Việc dùng 1.200 tấn than năm nay là bình thường.","1.100 < μ < 1.200. Khoảng tin cậy rộng hơn nên không thể kết luận gì về việc sử dụng 1.200 tấn than.","1.100 < μ < 1.140. Việc dùng 1.200 tấn than năm nay là không đáng tin cậy vì con ,"o":["dim()","str()","length()","lummary()"],"a":1},{"n":266,"q":"Nếu muốn ước lượng giá trị trung bình của một mẫu, phương pháp nào sau đây là phù hợp?","o":["Ước lượng khoảng tin cậy","Phân tích hồi quy","Kiểm định Chi-square","Kiểm định t ghép cặp"],"a":0},{"n":267,"q":"Cảm giác về thời tiết (nóng, lạnh, bình thường). Vậy biến cảm giác thời tiết được phân loại là biến gì?","o":["Định lượng dù nhiệt độ không phải là thang đo tỷ lệ","Định lượng vì nóng, lạnh, bình thường có phân cấp độ","Định lượng vì nóng hay lạnh được đo bằng nhiệt độ","Định tính vì không được đo lường cụ thể"],"a":3},{"n":268,"q":"Công thức xác định ước lượng khoảng","o":["Ước lượng điểm + (hoặc -) độ lệch chuẩn","Ước lượng điểm + (hoặc -) sai số biên","Ước lượng khoảng + (hoặc -) sai số biên","Ước lượng điểm + (hoặc -) alpha"],"a":1},{"n":269,"q":"Biểu đồ nào dùng để phát hiện phân phối bất đối xứng (skewness)?","o":["Biểu đồ tròn","Biểu đồ histogram","Biểu đồ cột","Biểu đồ phân tán"],"a":1},{"n":270,"q":"Theo kết quả xuất từ R của biến dữ liệu X, thì giá trị 6 thuộc phân vị nào?","o":["Phân vị 1 (25%)","Phân vị 2 (50%)","Phân vị 3 (75%)","Phân vị 4 (100%)"],"a":1,"e":"Không có dữ liệu cụ thể nên chọn B. Ví dụ với X <- c(2,3,5,6,7,8,10,11), quantile(X) cho 0%=2, 25%=4.5, 50%=6.5, 75%=8.5, 100%=11. Giá trị 6 nằm giữa Q1 = 4.5 và Q2 = 6.5 nên thuộc khoảng phân vị 2 (từ 25% đến 50%)."},{"n":271,"q":"Vẽ biểu đồ tần suất số lượng sinh viên theo ngành học là ví dụ của?","o":["Phân tích hồi quy","Thống kê mô tả","Phân tích biến thiên","Thống kê suy luận"],"a":1},{"n":272,"q":"Giảng viên trích xuất kết quả từ R như sau. Hãy xác định phân vị thứ 50 về doanh thu nhận được của công ty?\n> summary(Doanhthu)\nMin. 1st Qu. Median Mean 3rd Qu. Max.\n3500 4850 5150 5340 5950 7000","o":["4850","5340","5150","5950"],"a":2}];
var PQ = PRESET.map(function(p){ return {num:p.n, q:p.q, opts:p.o.map(function(t,i){return {k:String.fromCharCode(65+i), t:t}}), ans:String.fromCharCode(65+p.a), exp:p.e||"", img:p.img||""}; });
var MQ = PQ.filter(function(q){ return (q.num >= 1 && q.num <= 77) || (q.num >= 258 && q.num <= 272); });
$("mcount").textContent = MQ.length; $("pcount").textContent = PQ.length; $("pfrom").value = 1; $("pto").value = PQ.length;

var bank = [], run = [], idx = 0, score = 0, wrongs = [], answered = false;


function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function show(id){ ["setup","quiz","result"].forEach(function(s){ $(s).classList.toggle("hide", s!==id); }); window.scrollTo(0,0); }

function begin(list){
  run = $("shufQ").checked ? shuffle(list) : list.slice();
  if($("shufA").checked) run = run.map(function(q){
    var ref = q.opts.some(function(o){ return /(cả [a-d]|tất cả|đều đúng|đều sai|\b[a-d] và [a-d]\b)/i.test(o.t); });
    var c = {}; for(var k in q) c[k] = q[k];
    if(!ref) c.opts = shuffle(q.opts);
    return c;
  });
  idx = 0; score = 0; wrongs = []; show("quiz"); render();
}
function render(){
  var q = run[idx]; answered = false;
  $("pos").textContent = "Câu " + (idx+1) + "/" + run.length + (q.num ? " (câu " + q.num + " trong file)" : "");
  $("sc").textContent = "Đúng: " + score;
  $("fill").style.width = (idx/run.length*100) + "%";
  $("qt").textContent = q.q;
  var im = $("qimg"); if(q.img){ im.src = q.img; im.classList.remove("hide"); } else { im.classList.add("hide"); im.removeAttribute("src"); }
  $("exp").classList.add("hide");
  $("next").disabled = true;
  $("next").textContent = idx === run.length-1 ? "Xem kết quả" : "Câu tiếp theo";
  var box = $("opts"); box.innerHTML = "";
  q.opts.forEach(function(o, i){
    var b = document.createElement("button");
    b.className = "opt"; b.dataset.k = o.k;
    var s = document.createElement("b"); s.textContent = String.fromCharCode(65+i);
    var t = document.createElement("span"); t.textContent = o.t;
    b.appendChild(s); b.appendChild(t);
    b.onclick = function(){ pick(o.k); };
    box.appendChild(b);
  });
}
function pick(k){
  if(answered) return; answered = true;
  var q = run[idx], good = k === q.ans;
  if(good) score++; else wrongs.push({q:q, picked:k});
  Array.prototype.forEach.call($("opts").children, function(b){
    b.disabled = true;
    if(b.dataset.k === q.ans) b.classList.add("ok");
    else if(b.dataset.k === k) b.classList.add("bad");
  });
  var e = $("exp");
  e.textContent = (good ? "Chính xác. " : "Chưa đúng. ") + (q.exp || "");
  e.classList.remove("hide");
  $("sc").textContent = "Đúng: " + score;
  $("next").disabled = false; $("next").focus();
}
function text(q, k){ var o = q.opts.filter(function(x){return x.k===k})[0]; return o ? o.t : k; }
function finish(){
  show("result");
  var pct = Math.round(score/run.length*100);
  $("final").textContent = score + "/" + run.length + " (" + pct + "%)";
  $("msg").textContent = pct === 100 ? "Tuyệt đối. Bạn trả lời đúng tất cả." : pct >= 70 ? "Khá tốt. Xem lại các câu sai bên dưới để nhớ chắc hơn." : "Cần ôn thêm. Hãy xem các câu sai và làm lại.";
  var w = $("wrongs"); w.innerHTML = "";
  $("retryWrong").classList.toggle("hide", !wrongs.length);
  wrongs.forEach(function(x){
    var d = document.createElement("div"); d.className = "wrong";
    var h = document.createElement("strong"); h.textContent = x.q.q;
    var a = document.createElement("small"); a.textContent = "Bạn chọn: " + text(x.q, x.picked);
    var c = document.createElement("small"); c.style.color = "var(--ok)"; c.textContent = "Đáp án đúng: " + text(x.q, x.q.ans);
    d.appendChild(h); d.appendChild(a); d.appendChild(c);
    if(x.q.exp){ var e = document.createElement("small"); e.textContent = x.q.exp; d.appendChild(e); }
    w.appendChild(d);
  });
}

$("mstart").onclick = function(){ bank = MQ; begin(bank); };
$("pstart").onclick = function(){
  var a = parseInt($("pfrom").value,10), b = parseInt($("pto").value,10);
  var sel = PQ.filter(function(q){ return q.num >= a && q.num <= b; });
  if(!sel.length){ $("perr").textContent = "Không có câu nào trong khoảng này. Hãy nhập số từ 1 đến " + PQ.length + "."; return; }
  $("perr").textContent = ""; bank = sel; begin(bank);
};
$("next").onclick = function(){ if(idx < run.length-1){ idx++; render(); } else finish(); };
$("quit").onclick = function(){ show("setup"); };
$("again").onclick = function(){ begin(bank); };
$("retryWrong").onclick = function(){ begin(wrongs.map(function(x){return x.q;})); };
$("back").onclick = function(){ show("setup"); };
$("theme").onclick = function(){
  var r = document.documentElement, dark = getComputedStyle(r).getPropertyValue("--bg").trim() === "#0f1624";
  r.setAttribute("data-theme", dark ? "light" : "dark");
};
document.addEventListener("keydown", function(e){
  if($("quiz").classList.contains("hide")) return;
  var n = e.key.toUpperCase().charCodeAt(0) - 65;
  if(e.key.length === 1 && !answered && n >= 0 && n < run[idx].opts.length){ pick(run[idx].opts[n].k); }
  else if(e.key === "Enter" && answered){ $("next").click(); }
});
</script>
</body>
</html>
